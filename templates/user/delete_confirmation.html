<!DOCTYPE html>
<html>
<head>
    <title>Delete Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<div class="max-w-lg mx-auto mt-20 bg-white p-8 shadow-lg rounded-lg text-center">
    <h2 class="text-2xl font-bold text-red-600 mb-4">Delete Account</h2>
    <p class="text-gray-700 mb-6">
        Are you sure you want to permanently delete your account?
        <br>This action cannot be undone.
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit"
                class="bg-red-600 text-white px-6 py-2 rounded shadow hover:bg-red-700">
            Yes, Delete My Account
        </button>
        <a href="{% url 'profile' %}"
           class="ml-3 bg-gray-300 px-6 py-2 rounded hover:bg-gray-400">
            Cancel
        </a>
    </form>
</div>

</body>
</html>
