<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StyleCart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gradient-to-br from-gray-100 to-purple-100 min-h-screen flex items-center justify-center px-4">

    <div class="bg-white shadow-xl rounded-xl max-w-md w-full p-8">

        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-purple-600">Welcome Back</h1>
            <p class="text-gray-500 mt-1">Login to your StyleCart account</p>
        </div>

        <!-- Login Form -->
        <form method="POST" action="">
            {% csrf_token %}

            <!-- Username -->
            <div class="mb-4 relative">
                <i class="fas fa-user text-purple-500 absolute left-4 top-1/2 -translate-y-1/2 text-lg"></i>
                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
                    class="w-full pl-12 pr-3 py-3 rounded-lg border border-gray-300 focus:border-purple-500 focus:ring-2 focus:ring-purple-300 outline-none"
                >
            </div>

            <!-- Password -->
            <div class="mb-4 relative">
                <i class="fas fa-lock text-purple-500 absolute left-4 top-1/2 -translate-y-1/2 text-lg"></i>
                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                    class="w-full pl-12 pr-3 py-3 rounded-lg border border-gray-300 focus:border-purple-500 focus:ring-2 focus:ring-purple-300 outline-none"
                >
            </div>

            <!-- Submit -->
            <button
                type="submit"
                class="w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700 transition"
            >
                Sign In
            </button>
        </form>

        <!-- Divider -->
        <div class="flex items-center my-6">
            <div class="flex-1 border-t border-gray-300"></div>
            <span class="px-3 text-gray-400 text-sm">Or sign in with</span>
            <div class="flex-1 border-t border-gray-300"></div>
        </div>

        <!-- Social Buttons -->
        <div class="grid grid-cols-2 gap-4">
            <button class="border py-2 rounded-lg flex items-center justify-center hover:bg-gray-100 transition">
                <i class="fab fa-google text-red-500 mr-2"></i> Google
            </button>

            <button class="border py-2 rounded-lg flex items-center justify-center hover:bg-gray-100 transition">
                <i class="fab fa-facebook text-blue-600 mr-2"></i> Facebook
            </button>
        </div>

        <!-- Register link -->
        <p class="text-center mt-6 text-gray-600">
            Don't have an account?
            <a href="/user/register/" class="text-purple-600 font-semibold hover:underline">
                Create one here
            </a>
        </p>

    </div>

</body>
</html>
