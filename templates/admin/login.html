<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - StyleCart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        .input-focus:focus {
            outline: none;
            ring: 4px solid rgba(139, 92, 246, 0.2);
            border-color: #8b5cf6;
        }
        .btn-gradient {
            background: linear-gradient(to right, #8b5cf6, #6366f1);
            transition: all 0.3s;
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="login-card w-full max-w-md">
        <!-- Header -->
        <div class="bg-gradient-to-r from-purple-600 to-indigo-600 p-8 text-white text-center">
            <div class="flex justify-center mb-4">
                <div class="w-20 h-20 bg-white bg-opacity-20 rounded-full flex items-center justify-center">
                    <i class="fas fa-shield-alt text-4xl"></i>
                </div>
            </div>
            <h1 class="text-3xl font-bold">Admin Portal</h1>
            <p class="opacity-90 mt-2">StyleCart Administrator Login</p>
        </div>

        <!-- Form -->
        <div class="p-8">
            <div class="flex items-center justify-center mb-8">
                <i class="fas fa-shopping-bag text-4xl text-purple-600 mr-3"></i>
                <span class="text-2xl font-bold text-gray-800">StyleCart</span>
            </div>

            <form class="space-y-6" method="POST">
                {%csrf_token%}
                <!-- Username / Email Field -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-user mr-2 text-purple-600"></i> Username or Email
                    </label>
                    <input type="text" id="username" name="username" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-4 focus:ring-purple-200 focus:border-purple-500 transition input-focus"
                           placeholder="Enter your admin username">
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-lock mr-2 text-purple-600"></i> Password
                    </label>
                    <div class="relative">
                        <input type="password" id="password" name="password" required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-4 focus:ring-purple-200 focus:border-purple-500 transition input-focus pr-12"
                               placeholder="Enter your password">
                        <button type="button" onclick="togglePassword()"
                                class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-500 hover:text-purple-600">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center">
                        <input type="checkbox" name="remember" class="mr-2 rounded text-purple-600 focus:ring-purple-500">
                        <span class="text-gray-600">Remember me</span>
                    </label>
                    <a href="#" class="text-purple-600 hover:text-purple-800 font-medium">Forgot password?</a>
                </div>

                <!-- Error Message -->
                <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
                    <i class="fas fa-exclamation-circle mr-2"></i> <span id="errorText"></span>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                        class="w-full py-4 text-white font-semibold rounded-lg btn-gradient shadow-lg">
                    <i class="fas fa-sign-in-alt mr-2"></i> Login to Admin Dashboard
                </button>
            </form>

            <!-- Footer Links -->
            <div class="mt-8 text-center text-sm text-gray-500">
                <p>Not an admin?
                    <a href="/" class="text-purple-600 hover:text-purple-800 font-medium">Back to Store</a>
                </p>
                <p class="mt-3">
                    <a href="/seller/login/" class="text-indigo-600 hover:text-indigo-800">Login as Seller →</a>
                </p>
            </div>
        </div>
    </div>

    <script>
    </script>
</body>
</html>
